<title>Le Hameau vivant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : le village en temps réel (canvas, caméra qui suit le juge) | carnet de ce qu'on a vu et entendu. Au téléphone : village en haut, carnet dessous.
   Un seul univers visuel assumé : veillée sombre autour d'un village éclairé par le jour puis la lanterne. */
:root {
  --bg: #11151d; --surface: #1a202b; --surface2: #222a37; --ink: #ece6d8; --muted: #9aa1ad; --line: #2e3746;
  --candle: #e5a84b; --blood: #e0596f; --herbe: #6f8f4e;
  --c0: #ee8d55; --c1: #6aa8d8; --c2: #7bbb70; --c3: #bd8fd4; --c4: #e2b24f; --c5: #5cc3ba; --c6: #de77a6;
  --f-display: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--f-body); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); max-width: 1500px; margin: 0 auto; padding-inline: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 10px; }
h1 { font: 400 1.5rem/1 var(--f-display); margin: 0; letter-spacing: .02em; }
.horloge { font: 500 .85rem var(--f-mono); color: var(--candle); letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.enjeu { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); }
.pip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--blood); display: inline-block; }
.pip.plein { background: var(--blood); }
.outils { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 11px; font-size: .9rem; }
.btn:hover { border-color: var(--muted); }
.btn.fort { background: var(--candle); color: #1a1408; border-color: var(--candle); font-weight: 700; }
.corps { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; min-height: 0; padding-bottom: 14px; }
@media (max-width: 860px) { .app { height: auto; } .corps { grid-template-columns: minmax(0, 1fr); } }
.scene { position: relative; min-height: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0c0f16; touch-action: none; }
@media (max-width: 860px) { .scene { height: 64svh; } }
canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
.aide { position: absolute; left: 10px; bottom: 10px; font-size: .8rem; color: var(--ink); background: color-mix(in srgb, #0c0f16 70%, transparent); padding: 4px 9px; border-radius: 6px; pointer-events: none; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: min(560px, 90%); text-align: center;
  background: color-mix(in srgb, #0c0f16 82%, transparent); border: 1px solid var(--line); border-radius: 9px; padding: 7px 14px; font-size: .95rem; pointer-events: none; }
.toast em { color: var(--candle); font-style: normal; }

/* dialogue avec un villageois */
.dialogue { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(520px, calc(100% - 24px));
  background: var(--surface); border: 1px solid var(--candle); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: 0 8px 30px #0008; }
.dialogue .tete { display: flex; align-items: center; gap: 10px; }
.dialogue .tete b { font: 400 1.15rem var(--f-display); }
.dialogue .tete span { color: var(--muted); font-size: .85rem; }
.dialogue .tete button { margin-left: auto; }
.dialogue .rep { font-size: 1rem; min-height: 1.4em; }
.dialogue .questions { display: flex; flex-wrap: wrap; gap: 6px; }
.dialogue .questions button { border: 1px solid var(--line); background: var(--surface2); border-radius: 18px; padding: 5px 12px; font-size: .9rem; text-align: left; }
.dialogue .questions button:hover { border-color: var(--candle); }
.lent { font: .72rem var(--f-mono); color: var(--muted); letter-spacing: .05em; }

/* conseil et fin */
.voile { position: absolute; inset: 0; background: color-mix(in srgb, #06080d 70%, transparent); display: grid; place-items: center; padding: 14px; }
.panneau { width: min(600px, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.panneau h2 { font: 400 1.4rem var(--f-display); margin: 0; }
.panneau p { margin: 0; }
.avis { display: grid; gap: 6px; }
.avis div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.pastille { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .75rem var(--f-body); color: #10131a; }
.choix { display: flex; flex-wrap: wrap; gap: 6px; }

/* carnet */
.carnet { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 860px) { .carnet { max-height: 46svh; } }
.carnet h2 { font: 400 1rem var(--f-display); letter-spacing: .06em; margin: 0; padding: 10px 12px 6px; color: var(--muted); }
.entrees { overflow: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 7px; min-height: 0; }
.entree { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; font-size: .9rem; }
.entree .h { font: .72rem var(--f-mono); color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.entree.annonce .t { color: var(--candle); }
.entree.nuit .t { font-style: italic; }
.entree .tag { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 4px; }
.badge-ia { font: 500 .72rem var(--f-mono); letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; }
.saisie-dlg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.saisie-dlg input { min-width: 0; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; }
.dialogue .rep { white-space: pre-line; }
.entree.dit .t { color: var(--muted); }
.accueil-choix { display: grid; gap: 8px; }
.accueil-choix button { text-align: left; padding: 9px 12px; }
.accueil-choix button small { display: block; color: var(--muted); font-size: .82rem; }
.accueil-choix .btn.fort small { color: #3a2a0e; }
.entree.contradiction .t { border-left: 3px solid var(--blood); padding-left: 7px; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header>
    <h1>Le Hameau vivant</h1>
    <span class="horloge" id="horloge">Jour 1 · 07:00</span>
    <span class="enjeu" id="enjeu"></span>
    <span class="badge-ia" id="badge-ia">villageois scriptés</span>
    <div class="outils">
      <button class="btn" id="btn-pause" type="button">Pause</button>
      <button class="btn" id="btn-vitesse" type="button">Vitesse ×1</button>
      <button class="btn" id="btn-nouvelle" type="button">Nouvelle partie</button>
    </div>
  </header>
  <div class="corps">
    <div class="scene" id="scene">
      <canvas id="cv" aria-label="Le village vu de dessus. Clique pour marcher, clique sur un villageois pour lui parler."></canvas>
      <div class="toast" id="toast" hidden></div>
      <div class="aide" id="aide">Clique pour marcher · clique un villageois pour lui parler · flèches ou ZQSD</div>
      <div class="dialogue" id="dialogue" hidden></div>
      <div class="voile" id="voile" hidden><div class="panneau" id="panneau"></div></div>
    </div>
    <aside class="carnet" aria-label="Carnet">
      <h2>Carnet : vu, entendu, nuits</h2>
      <div class="entrees" id="entrees" aria-live="polite"></div>
    </aside>
  </div>
</div>

<script>
(() => {
"use strict";
/* ============================================================ monde */
const W = 1600, H = 1100;
const LIEUX = {
  place:    { nom: "la Place", a: "à la Place", de: "de la Place",    court: "Place",    x: 800,  y: 540, r: 125, trace: "boue" },
  taverne:  { nom: "la Taverne", a: "à la Taverne", de: "de la Taverne",  court: "Taverne",  x: 800,  y: 235, r: 95,  trace: "bière" },
  forge:    { nom: "la Forge", a: "à la Forge", de: "de la Forge",    court: "Forge",    x: 1190, y: 265, r: 90,  trace: "suie" },
  chapelle: { nom: "la Chapelle", a: "à la Chapelle", de: "de la Chapelle", court: "Chapelle", x: 405,  y: 245, r: 90,  trace: "cire" },
  grange:   { nom: "la Grange", a: "à la Grange", de: "de la Grange",   court: "Grange",   x: 370,  y: 585, r: 100, trace: "paille" },
  moulin:   { nom: "le Moulin", a: "au Moulin", de: "du Moulin",   court: "Moulin",   x: 1235, y: 650, r: 90,  trace: "farine" },
  lavoir:   { nom: "le Lavoir", a: "au Lavoir", de: "du Lavoir",   court: "Lavoir",   x: 820,  y: 885, r: 95,  trace: "eau" },
};
const CHEMINS = [["place","chapelle"],["place","taverne"],["place","forge"],["place","grange"],["place","moulin"],["place","lavoir"],
  ["taverne","forge"],["forge","moulin"],["moulin","lavoir"],["lavoir","grange"],["grange","chapelle"],["taverne","chapelle"]];
const MAISONS = [
  { id: "o1", x: 175, y: 395, q: "Ouest" }, { id: "o2", x: 215, y: 770, q: "Ouest" }, { id: "o3", x: 470, y: 805, q: "Ouest" }, { id: "o4", x: 600, y: 700, q: "Ouest" },
  { id: "e1", x: 1010, y: 410, q: "Est" }, { id: "e2", x: 1420, y: 395, q: "Est" }, { id: "e3", x: 1060, y: 735, q: "Est" }, { id: "e4", x: 1390, y: 150, q: "Est" },
];
const BERGERIE = { x: 165, y: 935 };
const RIVIERE = [[1620, 470], [1400, 600], [1150, 800], [880, 960], [560, 1010], [250, 1050], [-20, 1080]];

// graphe de marche : lieux + maisons (+ bergerie) reliés au lieu le plus proche
const NOEUDS = {};
for (const [id, L] of Object.entries(LIEUX)) NOEUDS[id] = { x: L.x, y: L.y, v: [] };
const lier = (a, b) => { NOEUDS[a].v.push(b); NOEUDS[b].v.push(a); };
for (const [a, b] of CHEMINS) lier(a, b);
const lieuProche = (x, y) => Object.entries(LIEUX).sort(([, a], [, b]) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y))[0][0];
for (const m of MAISONS) { m.lieu = lieuProche(m.x, m.y); m.fenetre = m.lieu; NOEUDS[m.id] = { x: m.x, y: m.y + 30, v: [] }; lier(m.id, m.lieu); }
NOEUDS.bergerie = { x: BERGERIE.x + 40, y: BERGERIE.y - 40, v: [] }; lier("bergerie", "grange");
function cheminNoeuds(de, vers) {
  const prec = { [de]: null }, file = [de];
  while (file.length) { const n = file.shift(); if (n === vers) break; for (const v of NOEUDS[n].v) if (!(v in prec)) { prec[v] = n; file.push(v); } }
  const out = []; for (let n = vers; n != null; n = prec[n]) out.unshift(n); return out;
}
const dans = (x, y) => { for (const [id, L] of Object.entries(LIEUX)) if (Math.hypot(L.x - x, L.y - y) < L.r) return id; return null; };

/* ============================================================ hasard */
const rnd = () => crypto.getRandomValues(new Uint32Array(1))[0] / 2 ** 32;
const pick = a => a[Math.floor(rnd() * a.length)];
const melange = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ============================================================ personnages */
const PERSOS = [
  { id: "meneur", ton: "tu parles avec autorité, tu organises le village et tu tranches vite", label: "meneur autoritaire", matin: ["place"], midi: ["*foule"], aprem: ["place", "taverne"], dit: "Écoute-moi bien :", oreille: .3 },
  { id: "parano", ton: "tu te méfies de tout le monde, tu remarques qui parle à qui, tu chuchotes", label: "paranoïaque", matin: ["forge", "taverne"], midi: ["forge", "chapelle"], aprem: ["forge"], dit: "Parle plus bas…", oreille: .75, fuit: true },
  { id: "discret", ton: "tu parles peu et brièvement, mais chaque mot compte", label: "discret", matin: ["lavoir"], midi: ["moulin", "lavoir"], aprem: ["chapelle", "lavoir"], dit: "", oreille: .5 },
  { id: "bavard", ton: "tu es chaleureux, tu racontes tout ce que tu as vu, parfois trop", label: "bavard sympathique", matin: ["taverne"], midi: ["place"], aprem: ["taverne"], dit: "Tu sais quoi ?", oreille: .25 },
  { id: "sceptique", ton: "tu doutes de tout, tu demandes des preuves, tu es un peu cynique", label: "sceptique", matin: ["*trace"], midi: ["place", "moulin"], aprem: ["taverne"], dit: "Franchement,", oreille: .3 },
  { id: "emotif", ton: "tu es sensible et inquiet, tu réagis avec ton cœur", label: "émotif", matin: ["chapelle"], midi: ["grange", "chapelle"], aprem: ["chapelle", "place"], dit: "J'en tremble encore…", oreille: .35 },
  { id: "stratege", ton: "tu raisonnes froidement, tu recoupes les faits et les horaires", label: "stratège", matin: ["forge", "place"], midi: ["*ailleurs"], aprem: ["place"], dit: "Réfléchis une seconde :", oreille: .3 },
  { id: "naif", ton: "tu fais confiance facilement et tu crois ce qu'on te dit", label: "naïf optimiste", matin: ["*suivre"], midi: ["*suivre", "lavoir"], aprem: ["place"], dit: "Oh,", oreille: .3 },
];
const PRENOMS = ["Marc", "Léa", "Hugo", "Camille", "Thomas", "Sophie", "Nicolas", "Élodie", "Julien", "Chloé"];
const FEMININS = new Set(["Léa", "Camille", "Sophie", "Élodie", "Chloé"]);
const accord = (nom, m, f) => FEMININS.has(nom) ? f : m;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const phrase = (dit, reste) => dit ? `${dit} ${reste}` : cap(reste);
const COULEURS = ["#ee8d55", "#6aa8d8", "#7bbb70", "#bd8fd4", "#e2b24f", "#5cc3ba", "#de77a6"];
const CHEVEUX = ["#3b2a1e", "#6b4a2b", "#c9a15a", "#1f1b18", "#8a3b22", "#5a4636", "#d8c7a0"];

let G;   // état de la partie
const VITESSE_JOUR = 3.4;   // minutes de jeu par seconde réelle
const JOUR_DEBUT = 7 * 60, CLOCHE = 18 * 60 + 15, CONSEIL = 18 * 60 + 50;

function nouvellePartie() {
  const noms = melange(PRENOMS).slice(0, 7), persos = melange(PERSOS).slice(0, 7), maisons = melange(MAISONS);
  const loup = Math.floor(rnd() * 7);
  const ias = noms.map((nom, i) => ({ nom, i, perso: persos[i], couleur: COULEURS[i], cheveux: CHEVEUX[i], ia: true, loup: i === loup, vivant: true,
    maison: maisons[i + 1], x: LIEUX.place.x, y: LIEUX.place.y, chemin: [], cible: null, lieu: "place", parle: null, cooldown: 0, vu: [], nuits: [], entendu: [], dernierLieu: null, prochain: 0, mensonges: 0 }));
  const moi = { nom: "Toi", humain: true, couleur: "#f1e6c8", cheveux: "#2a211a", maison: maisons[0], x: LIEUX.place.x, y: LIEUX.place.y + 70, chemin: [], vivant: true };
  G = { jour: 1, minute: JOUR_DEBUT, phase: "jour", ias, moi, morts: [], victimes: [], traces: [], chances: 3, pause: false, vitesse: 1, lent: false,
    convs: [], cloche: false, journal: [], vuParMoi: new Set(), sons: [], silhouette: null, nuit: null, loupMarche: null, dialogueAvec: null, fin: null, flammes: 0 };
  // placer tout le monde autour du feu
  ias.forEach((c, k) => { const a = (k / 7) * Math.PI * 2; c.x = LIEUX.place.x + Math.cos(a) * 75; c.y = LIEUX.place.y + Math.sin(a) * 55; c.prochain = 1 + rnd() * 3; });
  // prologue : nuit 0, le loup égorge un mouton à la bergerie
  const l = ias[loup], pts = tracerChemin(cheminNoeuds(l.maison.id, "bergerie"));
  temoinsNuit(pts, null);
  G.traces.push({ pts: pts.slice(Math.floor(pts.length * .45)), matiere: "boue", jour: 1 });
  G.victimes.push({ nom: "un mouton", jour: 0 });
  noter("annonce", "Jour 1, aube. Un mouton a été égorgé cette nuit à la bergerie, près de la lisière. Des empreintes de loup repartent vers le village.");
  noter("annonce", "Le Loup se cache parmi les sept villageois. Il ne peut dévorer que quelqu'un qu'il a croisé dans la journée.");
  toast("Jour 1 — un mouton égorgé à la bergerie. Promène-toi, écoute, interroge.");
  rendreEnjeu(); rendreJournal();
}

/* ============================================================ chemins */
function tracerChemin(noeuds) {   // points intermédiaires tous les ~12 unités, pour la marche et les empreintes
  const pts = [];
  for (let k = 0; k < noeuds.length - 1; k++) {
    const A = NOEUDS[noeuds[k]], B = NOEUDS[noeuds[k + 1]], d = Math.hypot(B.x - A.x, B.y - A.y), n = Math.max(1, Math.round(d / 12));
    for (let s = 0; s < n; s++) pts.push({ x: A.x + (B.x - A.x) * s / n, y: A.y + (B.y - A.y) * s / n, n: noeuds[k] });
  }
  const Z = NOEUDS[noeuds[noeuds.length - 1]]; pts.push({ x: Z.x, y: Z.y, n: noeuds[noeuds.length - 1] });
  return pts;
}
function allerA(c, lieu) {
  const depart = dans(c.x, c.y) || lieuProche(c.x, c.y);
  const ns = cheminNoeuds(depart, lieu), L = LIEUX[lieu];
  const a = rnd() * Math.PI * 2, rr = L.r * (.25 + rnd() * .45);
  c.chemin = [...ns.slice(1).map(n => ({ x: NOEUDS[n].x + (rnd() - .5) * 30, y: NOEUDS[n].y + (rnd() - .5) * 30 })), { x: L.x + Math.cos(a) * rr, y: L.y + Math.sin(a) * rr * .7 }];
  c.but = lieu;
}
function flaner(c) { const L = LIEUX[c.lieu || "place"], a = rnd() * Math.PI * 2, rr = L.r * (.2 + rnd() * .5); c.chemin = [{ x: L.x + Math.cos(a) * rr, y: L.y + Math.sin(a) * rr * .7 }]; }

/* ============================================================ temps et routines */
const periode = m => m < 11 * 60 ? "matin" : m < 14 * 60 ? "midi" : "aprem";
const heure = m => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}`;
const heureDite = m => { const h = Math.floor(m / 60), mn = Math.round((m % 60) / 15) * 15; return mn === 60 ? `${h + 1}h` : mn ? `${h}h${mn}` : `${h}h`; };
const vivantsIA = () => G.ias.filter(c => c.vivant);
const parNom = n => G.ias.find(c => c.nom === n);

function choisirLieu(c) {
  const p = c.perso, liste = p[periode(G.minute)];
  if (rnd() < .18) return pick(Object.keys(LIEUX));
  let choix = pick(liste);
  if (choix === "*foule") { const cpt = {}; for (const o of vivantsIA()) if (o !== c && o.lieu) cpt[o.lieu] = (cpt[o.lieu] || 0) + 1; choix = Object.entries(cpt).sort((a, b) => b[1] - a[1])[0]?.[0] || "place"; }
  else if (choix === "*trace") { const v = G.victimes[G.victimes.length - 1]; const m = v && v.maison ? v.maison.lieu : "grange"; choix = m; }
  else if (choix === "*ailleurs") { choix = pick(Object.keys(LIEUX).filter(l => l !== c.lieu)); }
  else if (choix === "*suivre") { const o = pick(vivantsIA().filter(o => o !== c)); choix = o?.but || o?.lieu || "place"; }
  // le loup cherche à croiser quelqu'un l'après-midi s'il n'a encore repéré personne
  if (c.loup && periode(G.minute) === "aprem" && !rencontresDuJour(c).length) { const o = pick(vivantsIA().filter(o => o !== c && o.lieu)); if (o) choix = o.lieu; }
  return choix;
}
const rencontresDuJour = (c, jour = G.jour) => c.vu.filter(v => v.jour === jour && parNom(v.qui)?.vivant);

/* ============================================================ mémoire et perception */
function observer() {
  const ias = vivantsIA();
  for (const c of ias) c.lieu = dans(c.x, c.y);
  for (const a of ias) for (const b of ias) {
    if (a === b || !a.lieu || a.lieu !== b.lieu) continue;
    if (!a.vu.some(v => v.jour === G.jour && v.qui === b.nom && v.lieu === a.lieu)) a.vu.push({ jour: G.jour, minute: G.minute, qui: b.nom, lieu: a.lieu });
  }
  if (G.phase !== "jour") return;
  // ce que le juge voit : quelqu'un dans un lieu, dans son champ de vision
  for (const c of ias) {
    if (!c.lieu || dist(c, G.moi) > VUE) continue;
    const k = `${G.jour}|${c.nom}|${c.lieu}`;
    if (!G.vuParMoi.has(k)) { G.vuParMoi.add(k); noter("vu", `${c.nom} ${LIEUX[c.lieu].a}.`); }
  }
}
